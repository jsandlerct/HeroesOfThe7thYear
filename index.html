<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heroes of the Seventh Year</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 16px;
      font-family: Georgia, serif;
    }
    #game-container canvas { display: block; }

    #battle-ui {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    #targeting-controls {
      display: none;
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #333;
      border-top: none;
      padding: 7px 12px;
      font-family: Georgia, serif;
      font-size: 12px;
      color: #aaa;
      box-sizing: border-box;
      align-items: center;
      gap: 14px;
    }
    .tc-group {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #ddd;
    }
    .tc-select {
      background: #111;
      border: 1px solid #444;
      color: #ddd;
      font-family: Georgia, serif;
      font-size: 12px;
      padding: 3px 6px;
      border-radius: 3px;
      cursor: pointer;
    }

    /* ── Off-season wizard (full-screen) ──────────────────────────── */
    #offseason-ui {
      display: none;
      position: fixed;
      inset: 0;
      flex-direction: column;
      background: #1a1610;
      color: #e0d4b0;
      font-family: Georgia, serif;
      z-index: 100;
    }
    #os-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 28px;
      background: #0f0d08;
      border-bottom: 1px solid #3a2a10;
      font-size: 12px;
      color: #7a6a4a;
      flex-shrink: 0;
    }
    #os-step-label {
      padding: 14px 28px 13px;
      font-size: 22px;
      color: #c9a84c;
      letter-spacing: 0.04em;
      border-bottom: 1px solid #2a1e08;
      background: #1a1610;
      flex-shrink: 0;
    }
    #os-content {
      overflow-y: auto;
      flex: 1;
      line-height: 1.65;
    }
    /* Step renderers receive a .os-inner div — centered, max-width */
    .os-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 28px 40px;
    }
    #os-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 28px;
      border-top: 1px solid #3a2a10;
      background: #0f0d08;
      flex-shrink: 0;
    }
    .os-btn {
      background: #2a2010;
      border: 1px solid #6a5030;
      color: #c9a84c;
      font-family: Georgia, serif;
      font-size: 13px;
      padding: 8px 22px;
      cursor: pointer;
      border-radius: 3px;
      letter-spacing: 0.03em;
      transition: background .15s, border-color .15s;
    }
    .os-btn:hover:not(:disabled) { background: #3a2e18; border-color: #9a7840; }
    .os-btn:disabled { opacity: 0.35; cursor: default; }
    .os-btn-primary {
      background: #3a2a10;
      border-color: #c9a84c;
      color: #f0e0a0;
    }
    .os-btn-primary:hover:not(:disabled) { background: #4a3820; }
    /* Investment screen helpers */
    .os-section-title {
      font-size: 13px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #7a6a4a;
      margin: 28px 0 14px;
      padding-bottom: 6px;
      border-bottom: 1px solid #2a1e08;
    }
    .os-section-title:first-child { margin-top: 0; }
    .os-gold-bar {
      position: sticky;
      top: 0;
      background: #0f0d08;
      border: 1px solid #3a2a10;
      padding: 10px 16px;
      margin-bottom: 20px;
      display: flex;
      gap: 28px;
      font-size: 14px;
      z-index: 10;
    }
    .os-gold-item { color: #8a7a5a; }
    .os-gold-item strong { color: #c9a84c; }
    .os-gold-remaining strong { color: #f0e0a0; font-size: 15px; }
    .os-wall-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 8px;
    }
    .os-wall-card {
      background: #201810;
      border: 1px solid #3a2a10;
      padding: 14px;
      border-radius: 3px;
    }
    .os-wall-card h4 {
      font-size: 13px;
      color: #c9a84c;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .os-hp-bar-wrap {
      height: 6px;
      background: #0f0d08;
      border-radius: 3px;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .os-hp-bar-fill { height: 100%; background: #5a8a3a; border-radius: 3px; transition: width .3s; }
    .os-hp-label { font-size: 12px; color: #8a7a5a; margin-bottom: 12px; }
    .os-btn-sm {
      background: #2a2010;
      border: 1px solid #6a5030;
      color: #c9a84c;
      font-family: Georgia, serif;
      font-size: 12px;
      padding: 5px 12px;
      cursor: pointer;
      border-radius: 3px;
      margin-right: 6px;
      margin-bottom: 6px;
      transition: background .12s;
    }
    .os-btn-sm:hover:not(:disabled) { background: #3a2e18; }
    .os-btn-sm:disabled { opacity: 0.35; cursor: default; }
    .os-btn-sm.committed { border-color: #c9a84c; color: #f0e0a0; }
    .os-building-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .os-building-table th {
      text-align: left;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6a5a3a;
      padding: 6px 10px;
      border-bottom: 1px solid #2a1e08;
    }
    .os-building-table td { padding: 9px 10px; border-bottom: 1px solid #251a08; vertical-align: middle; }
    .os-building-table tr:last-child td { border-bottom: none; }
    .os-building-table tr.locked td { opacity: 0.45; }
    .os-building-table tr.maxed td:not(:last-child) { opacity: 0.55; }
    .os-cat-row td {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #5a4a2a;
      padding: 14px 10px 4px;
      border-bottom: 1px solid #2a1e08;
      background: #1a1610;
    }
    .os-prereq-note { font-size: 11px; color: #5a4a2a; font-style: italic; }
    .os-confirm-table { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 24px; }
    .os-confirm-table td { padding: 9px 12px; border-bottom: 1px solid #251a08; }
    .os-confirm-table tr:last-child td { border-bottom: none; }
    .os-warn { background: #201408; border: 1px solid #5a3010; padding: 12px 16px; font-size: 13px; color: #a08050; margin-bottom: 20px; line-height: 1.6; }
  </style>
</head>
<body>
  <div id="offseason-ui">
    <div id="os-header">
      <span id="os-year-label">Off Season · Year 1</span>
      <span id="os-step-indicator">Step 1 of 8</span>
    </div>
    <div id="os-step-label">Loading…</div>
    <div id="os-content"></div>
    <div id="os-nav">
      <button id="os-btn-prev" class="os-btn">← Previous</button>
      <button id="os-btn-next" class="os-btn os-btn-primary">Next →</button>
    </div>
  </div>

  <div id="battle-ui">
    <div id="game-container"></div>

    <div id="targeting-controls">
      Targeting:
      <span class="tc-group">Melee
        <select id="pref-melee" class="tc-select">
          <option value="default">Default</option>
          <option value="orc">Orc</option>
          <option value="goblin">Goblin</option>
          <option value="ogre">Ogre</option>
          <option value="general">General</option>
          <option value="catapult">Catapult</option>
        </select>
      </span>
      <span class="tc-group">Ranged
        <select id="pref-ranged" class="tc-select">
          <option value="default">Default</option>
          <option value="orc">Orc</option>
          <option value="goblin">Goblin</option>
          <option value="ogre">Ogre</option>
          <option value="general">General</option>
          <option value="catapult">Catapult</option>
        </select>
      </span>
      <span class="tc-group">Siege
        <select id="pref-siege" class="tc-select">
          <option value="default">Default</option>
          <option value="orc">Orc</option>
          <option value="goblin">Goblin</option>
          <option value="ogre">Ogre</option>
          <option value="general">General</option>
          <option value="catapult">Catapult</option>
        </select>
      </span>
      <span class="tc-group" style="margin-left:auto;">
        <label style="display:flex;align-items:center;gap:5px;cursor:pointer;color:#ddd;">
          <input type="checkbox" id="slomo-toggle" style="cursor:pointer;accent-color:#ffdd44;">
          Slow Mo
        </label>
      </span>
    </div>
  </div>

  <!-- Phaser 3 — must load before the module so `Phaser` global is available -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.87.0/dist/phaser.min.js"></script>
  <script type="module">
    import { GameState } from './src/state/GameState.js';
    import { initNavButtons, startOffSeason } from './src/offseason/OffSeasonUI.js';
    import './src/main.js';

    initNavButtons();

    // Sprint 3: after each battle ends, BattleScene fires a 'battleComplete' event.
    // The handler here will call startOffSeason(GameState, onComplete) where onComplete
    // writes wizardState.assignments back to the roster and calls window.game.scene.start('BattleScene').
    // Year 1 launches directly into battle (no prior off-season).

    const PREFS_KEY = 'hotyPrefs';

    function savePrefs() {
      localStorage.setItem(PREFS_KEY, JSON.stringify({
        melee:  GameState.targetingPreference.melee,
        ranged: GameState.targetingPreference.ranged,
        siege:  GameState.targetingPreference.siege,
        sloMo:  GameState.sloMo,
      }));
    }

    function loadPrefs() {
      try {
        const saved = JSON.parse(localStorage.getItem(PREFS_KEY));
        if (!saved) return;
        if (saved.melee)  { GameState.targetingPreference.melee  = saved.melee;  document.getElementById('pref-melee').value  = saved.melee; }
        if (saved.ranged) { GameState.targetingPreference.ranged = saved.ranged; document.getElementById('pref-ranged').value = saved.ranged; }
        if (saved.siege)  { GameState.targetingPreference.siege  = saved.siege;  document.getElementById('pref-siege').value  = saved.siege; }
        if (saved.sloMo)  { GameState.sloMo = saved.sloMo; document.getElementById('slomo-toggle').checked = saved.sloMo; }
      } catch (_) {}
    }

    loadPrefs();

    // Wire targeting dropdowns to GameState
    document.getElementById('pref-melee').onchange   = e => { GameState.targetingPreference.melee  = e.target.value;   savePrefs(); };
    document.getElementById('pref-ranged').onchange  = e => { GameState.targetingPreference.ranged = e.target.value;   savePrefs(); };
    document.getElementById('pref-siege').onchange   = e => { GameState.targetingPreference.siege  = e.target.value;   savePrefs(); };
    document.getElementById('slomo-toggle').onchange = e => { GameState.sloMo = e.target.checked;                      savePrefs(); };

    // Start Year 1 with a randomly selected enemy composition (0=A, 1=B, 2=C)
    GameState.year = 1;
    GameState.enemyCompositionIndex = Math.floor(Math.random() * 3);

    document.getElementById('targeting-controls').style.display = 'flex';
    window.game.scene.start('BattleScene');
  </script>
</body>
</html>
